<!DOCTYPE html>
<html>

<head>

    <title>S Cube Fitness - Register</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #111111;
            font-family: Arial;
        }

        .register-box {
            width: 350px;
            margin: auto;
            margin-top: 30px;
            background: #222222;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gold;
        }

        .logo {
            width: 220px;
            display: block;
            margin: auto;
        }

        h2 {
            color: gold;
            text-align: center;
            margin-top: 15px;
        }

        label {
            color: white;
        }

        .form-control {
            margin-bottom: 15px;
        }

        .btn-register {
            width: 100%;
            background: gold;
            color: black;
            font-weight: bold;
        }

        .btn-register:hover {
            background: orange;
        }

        p {
            color: white;
            text-align: center;
            margin-top: 15px;
        }

        a {
            color: gold;
            text-decoration: none;
        }
    </style>

</head>

<body>

    <div class="register-box">

        <img src="C:\Users\Asus\Study Material\Project\Gym_Logo.jpeg" class="logo" alt="S Cube Fitness Logo">

        <h2>Member Registration</h2>

        <form id="registerForm">

            <label>Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="Enter Full Name" required>

            <label>Mobile Number</label>
            <input type="tel" id="mobile" class="form-control" placeholder="Enter 10 digit Mobile Number" maxlength="10"
                inputmode="numeric" required>

            <label>Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter Password" required>

            <label>Confirm Password</label>
            <input type="password" id="confirm" class="form-control" placeholder="Re-enter Password" required>

            <button type="submit" class="btn btn-register">
                Register
            </button>

            <p>
                Already have an account?
                <a href="Login_Page.html">Login Here</a>
            </p>

        </form>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, deleteUser } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAUuV9raC17M7YiUAazJzAv1TL9tg4Nst8",
            authDomain: "scubefitness-e2ea4.firebaseapp.com",
            projectId: "scubefitness-e2ea4",
            storageBucket: "scubefitness-e2ea4.firebasestorage.app",
            messagingSenderId: "792208478421",
            appId: "1:792208478421:web:a3d5f7467d2f5fc266125c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function mobileToEmail(mobile) {
            return mobile + "@scubefitness.app";
        }

        const registerForm = document.getElementById("registerForm");

        registerForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const mobile = document.getElementById("mobile").value.trim();
            const password = document.getElementById("password").value;
            const confirm = document.getElementById("confirm").value;

            if (name === "") {
                alert("Enter Name");
                return;
            }

            if (!/^\d{10}$/.test(mobile)) {
                alert("Mobile Number must be exactly 10 digits");
                return;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters");
                return;
            }

            if (password !== confirm) {
                alert("Passwords do not match");
                return;
            }

            const button = document.querySelector(".btn-register");
            button.disabled = true;
            button.textContent = "Registering...";

            let user = null;

            try {
                const result = await createUserWithEmailAndPassword(
                    auth,
                    mobileToEmail(mobile),
                    password
                );

                user = result.user;

                await setDoc(doc(db, "members", user.uid), {
                    name: name,
                    mobile: mobile,
                    createdAt: new Date().toISOString()
                });

                alert("Registration Successful");
                window.location.href = "index.html";
            } catch (error) {
                console.error(error);

                // Avoid leaving an Auth account behind if the Firestore write failed.
                if (user) {
                    try {
                        await deleteUser(user);
                    } catch (cleanupError) {
                        console.error("Cleanup error:", cleanupError);
                    }
                }

                if (error.code === "auth/email-already-in-use") {
                    alert("This mobile number is already registered.");
                } else if (error.code === "auth/weak-password") {
                    alert("Password must be at least 6 characters.");
                } else if (error.code === "permission-denied") {
                    alert("Firestore permission denied. Check your Firestore rules.");
                } else {
                    alert("Registration failed: " + error.message);
                }
            } finally {
                button.disabled = false;
                button.textContent = "Register";
            }
        });
    </script>
</body>

</html>
